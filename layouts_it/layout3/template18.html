<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .image {
            flex: 1;
            display: flex;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales properly */
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #f5f5f5;
        }


        .arrow {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: white;
            background: #1a2942;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        .body-text {
            font-size: 2em;
            color: #333;
            line-height: 1.5;
        }

    </style>
</head>
<body>
<div class="container">
<div class="content">

    <div class="arrow">➜</div>
    <div class="title-text">INTERNATIONAL CONCERNS OVER BUFFER ZONE INCURSIONS</div>
    <div class="body-text">Israel's buffer zone actions breach international agreements, causing global concern amid tensions.In a dramatic move, Israel targeted Syria with 250 air strikes in 48 hours, escalating regional tensions.</div>

</div>

<img alt="News Image" src="C:\Users\shash\Downloads\569ea63d-c446-424d-8a3d-f3ae1f940ef0.jpeg"/>
</div>
</div>
</body>
</html>
