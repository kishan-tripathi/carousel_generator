<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 90px;
            width: 90px;
            padding: 5px;
            
            z-index: 2;
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            z-index: 2;
        }

        .title-text {
            position: absolute;
            top: 90px; 
            left: 20px;
            right: 20px;
            z-index: 2;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: #1a2942;
            padding: 15px; 
            text-align: center;
            border-radius: 5px;
        }

        .body-text {
            position: absolute;
            top: 250px;
            left: 20px;
            right: 20px;
            z-index: 2;
            font-size: 20px;
            color: #333;
            line-height: 1.5;
        }

        .image {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 67%;
            background-size: cover;
            background-position: center;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; 
        }

    </style>
</head>
<body>
    <div class="container">
        
        <div class="arrow">➜</div>
        
        <div class="title-text">
            'We'll never let our land be used against India': Sri Lankan President
        </div>

        <div class="body-text">
            After meeting PM Modi in Delhi, on a state visit, he met President Murmu 
            and will also visit Bihar's Bodh Gaya.on a state visit, he met President Murmu.
        </div>

        <div class="image">
            <img src="C:\Users\shash\Downloads\ac093c6e-7de3-4daa-9f70-3dd8f9e19a86.jpeg" alt="Image">
        </div>

    </div>
</body>
</html>
