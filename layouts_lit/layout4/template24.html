<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .logo {
            position: absolute;
            top: 20px;
            height: 90px;
            width: 90px;
            left: 20px;
            z-index: 2;
        }

        .logo img {
            height: 90px;
            width: 90px;
        }

        .arrow {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            z-index: 2;
        }

        .title-text {
            position: absolute;
            top: 110px;
            left: 20px;
            right: 20px;
            z-index: 2;
            font-size: 48px;
            font-weight: bold;
            color: white;
            background: #1a2942;
            padding: 10px;
            text-align: center;
        }

        .body-text {
            position: absolute;
            top: 250px;
            left: 20px;
            right: 20px;
            z-index: 2;
            font-size: 20px;
            color: #333;
            margin-top: 10px;
            line-height: 1.5;
        }

        .image {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70%;
            background-size: cover;
            background-position: center;
            
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="tatva-logo.png" alt="logo">
        </div>
        
        <div class="arrow">➜</div>
        
        <div class="title-text">
            'We'll never let our land be used against India': Sri Lankan President
        </div>

        <div class="body-text">
            After meeting PM Modi in Delhi, on a state visit, he met President Murmu 
            and will also visit Bihar's Bodh Gaya.
        </div>

        <div class="image">
            <img src="C:\Users\shash\Downloads\ac093c6e-7de3-4daa-9f70-3dd8f9e19a86.jpeg" alt="Image">
        </div>

        <div class="watermark">
            <span>↑</span>
            <span>🎮</span>
            <span>⚡</span>
        </div>
    </div>
</body>
</html>
