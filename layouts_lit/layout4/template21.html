<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Arial, sans-serif;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image {
            width: 100%;
            height: 70%;
            background-size: cover;
            background-position: center;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            width: 100%;
            height: 30%;
            background: #f5f5f5;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            height: 90px;
            width: 90px;
            padding: 5px; 
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
        }

        .title-text {
            font-size: 3em;
            font-weight: bold;
            color: white;
            background: #1a2942;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            border-radius: 5px; 
        }

        .body-text {
            font-size: 20px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 20px;
            color: #333;
            text-align: center;
            position: absolute;
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: auto;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="C:\Users\shash\Downloads\ac093c6e-7de3-4daa-9f70-3dd8f9e19a86.jpeg" alt="Image">
        </div>

        <div class="content">
            <div class="title-text">
                'We'll never let our land be used against India': Sri Lankan President 
            </div>

            <div class="body-text">
                After meeting PM Modi in Delhi, on a state visit, he met President Murmu 
                and will also visit Bihar's Bodh Gaya.
            </div>

            <div class="logo">
                <img src="logo.png" alt="logo">
            </div>

            <div class="arrow">➜</div>
            <div class="brand-name">www.legalwires.com</div>
        </div>
    </div>
</body>
</html>
