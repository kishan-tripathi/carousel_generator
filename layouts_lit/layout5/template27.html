<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
       
        }

        .container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1080px;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.1) 0%,
                rgba(0,0,0,0.5) 70%,
                rgba(0,0,0,1.0) 100%
            );
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-text {
            position: absolute;
            bottom: 150px; /* Adjusted to make space for body-text */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            font-size: 3em;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .body-text {
            position: absolute;
            bottom: 60px; /* Positioned below title-text */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-size: 1.5em;
            line-height: 1.4;
            opacity: 0.9;
        }

        .logo {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            height: 50px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image">
            <img src="C:\Users\shash\OneDrive\Pictures\Screenshots\Screenshot 2024-11-25 140652.png" alt="Flight attendant demonstrating safety instructions">
        </div>
        <div class="title-text">
            Air India cabin crew caught smuggling 1.7 kg gold at Chennai airport from Dubai
        </div>
        <div class="body-text">
            She along with a passenger were arrested after interception by authorities.
        </div>
        <div class="logo">
            <img src="tatva-logo.png" alt="The Tatva Logo">
        </div>
    </div>
</body>
</html>
