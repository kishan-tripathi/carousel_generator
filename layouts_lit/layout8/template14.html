<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #1a2942;
        }

        .image {
            width: 48%;
            height: 100%;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }

        .image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(26,41,66,0.4), transparent);
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            width: 50%;
            padding: 60px 60px 60px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            margin-left: -30px;
        }

        .logo {
            position: absolute;
            top: 20px;
            right: 60px;
            height: 100px;
            width: 100px;
            border-radius: 10px;
            padding: 15px;
        }

        .logo img {
            height: 100%;
            width: 100%;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: white;
            margin-bottom: 40px;
            line-height: 1.2;
            position: relative;
            padding-bottom: 25px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .body-text {
            font-size: 2em;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
            margin-bottom: 50px;
            padding-right: 40px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .brand-name {
            position: absolute;
            bottom: 40px;
            left: 100px;
            font-size: 1.6em;
            color: white;
            display: flex;
            align-items: left;
            gap: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image">
            <img alt="News Image" src="C:\Users\shash\Downloads\11738e12-9088-41a5-906e-b15f74952a78.jpeg"/>
        </div>
        <div class="content">
            <div class="logo">
                <img src="C:\ucarousel_gen\logos\lexLogo.svg.svg" alt="Logo">
            </div>
            <div class="title-text">ISRAEL ASSERTS CONTROL IN GOLAN HEIGHTS</div>
            <div class="body-text">Israel has seized key territories in the Golan Heights, citing national security amidst Assad regime collapse citing national security amidst Assad regime collapse regime collapse.</div>
            <div class="brand-name">www.legalwires.com</div>
        </div>
    </div>
</body>
</html>
