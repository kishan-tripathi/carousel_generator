<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .image {
            flex: 1;
            display: flex;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales properly */
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #f5f5f5;
        }

        .logo {
            height: 90px;
            width: 90px;
            margin-bottom: 20px;
        }

        .logo img {
            height: 90px;
            width: 90px;
        }

        .arrow {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: white;
            background: #1a2942;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .body-text {
            font-size: 2em;
            color: #333;
            line-height: 1.5;
        }

        .watermark {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
<div class="image">
<img alt="News Image" src="C:\Users\shash\Downloads\c994f35e-d4f6-4b38-82c4-23dd63aa5e55.jpeg"/>
</div>
<div class="content">
    <div class="logo">
        <img src="C:\ucarousel_gen\logos\lexLogo.svg.svg" alt="Logo">
    </div>

    <div class="arrow">➜</div>
    <div class="title-text">STRATEGIC AIR STRIKES IN DAMASCUS, HOMS</div>
    <div class="body-text">Israeli air strikes targeted military sites in cities like Damascus and Homs, crippling Syria's capabilities.</div>
    <div class="watermark">
        <span>↑</span>
        <span>🎮</span>
        <span>⚡</span>
    </div>
</div>
</div>
</body>
</html>
