<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Growth Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            padding: 40px;
            display: flex;
            flex-direction: column;
            background: #B8C4D2;
            justify-content: space-between;
        }

        .logo {
            position: absolute;
            top: 40px;
            right: 40px;
            height: 90px;
            width: 90px;
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .title-text {
            font-size: 4.5em;
            font-weight: bold;
            color: #1A1A1A;
            line-height: 1.1;
            max-width: 800px;
            max-height: 400px;
            margin-top: 100px;
            text-align: left;
        }

        .body-text {
            font-size: 2.5em;
            color: #1A1A1A;
            max-width: 600px;
            text-align: left;
            margin-bottom: 200px;
        }

        .arrow {
            font-size: 30px;
            color: #1A1A1A;
            position: absolute;
            bottom: 40px;
            right: 40px; 
        }

        .brand-name {
            position: absolute;
            bottom: 40px; 
            left: 40px;
            font-size: 2em;
            color: #1A1A1A;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/placeholder.svg?height=90&width=90" alt="Logo"/>
        </div>
        <div class="title-text">There's exponential growth happening exponential growth happening</div>
        <div class="body-text">Carousel posts are seeing great reach and results. Carousel posts are seeing great reach and results. Carousel posts are seeing great reach and results. Carousel posts are seeing great reach and results</div>
        <div class="arrow">➜</div>
        <div class="brand-name">www.legalwires.com</div>
    </div>
</body>
</html>
