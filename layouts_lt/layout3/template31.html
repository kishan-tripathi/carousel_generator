<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>News Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: 'Times New Roman', serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #4A1D1D;
        }

        .number {
            font-size: 5em;
            font-weight: bold;
            margin-bottom: 0px;
            margin-top: 40px;
            color:#FFFFFF;
        }        

        .logo {
            position: absolute;
            top: 40px;
            right: 40px;
            height: 90px;
            width: 90px;
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .title-text {
            font-size: 5em;
            font-weight: normal;
            line-height: 1.2;
            max-width: 800px;
            margin-bottom: 30px;
            margin-top: 100px;
            color:#FFFFFF;
        }

        .body-text {
            font-size: 2.5em;
            line-height: 1.4;
            max-width: 800px;
            margin-bottom: auto;
            color:#FFFFFF;
        }

        .brand-name {
            position: absolute;
            bottom: 40px;
            left: 40px;
            font-size: 2em;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="number">07</div>
        <div class="logo">
            <img src="/placeholder.svg?height=90&width=90" alt="Logo"/>
        </div>
        <div class="title-text">
            START WITH A SOLID BUSINESS PLAN
        </div>
        <div class="body-text">
            A well-crafted business plan is essential for success. Outline your goals, target market, products/services, marketing strategies, and financial projections. It sets the foundation for your business.
        </div>
        <div class="brand-name">www.legalwires.com</div>
    </div>
</body>
</html>
