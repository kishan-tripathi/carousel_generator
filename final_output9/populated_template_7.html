<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Verdana;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #096d6d;
        }

        .image {
            width: 48%;
            height: 100%;
            position: relative;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }

        .image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(26,41,66,0.4), transparent);
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            width: 50%;
            padding: 60px 60px 60px 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            margin-left: -30px;
        }

        .logo {
            position: absolute;
            top: 20px;
            right: 60px;
            height: 100px;
            width: 100px;
            border-radius: 10px;
            padding: 15px;
        }

        .logo img {
            height: 100%;
            width: 100%;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: #fcfbfb;
            margin-bottom: 40px;
            line-height: 1.2;
            position: relative;
            padding-bottom: 25px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .body-text {
            font-size: 2em;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 50px;
            padding-right: 40px;
            word-wrap: break-word;
            overflow-wrap: break-word;
            max-width: 100%;
        }

        .brand-name {
            position: absolute;
            bottom: 40px;
            left: 100px;
            font-size: 1.6em;
            color: #c16e15;
            display: flex;
            align-items: left;
            gap: 15px;
        }
    </style>
</head>
<body>
<div class="container">
<div class="image">
<img alt="News Image" src="images\placeholder.jpg"/>
</div>
<div class="content">
<div class="logo">
<img alt="Logo" src="C:\Users\shash\OneDrive\Documents\Carousel_generator\logos\Nonelogo_.svg"/>
</div>
<div class="title-text">THE PUZZLE OF MESSING UP</div>
<div class="body-text">Self-sabotage manifests in many ways. We may falter in public speaking, waste valuable time, or nitpick our partners. This behavior leads to deferring goals and harming relationships, raising a big question.</div>
<div class="brand-name">@legalwires</div>
</div>
</div>
</body>
</html>
