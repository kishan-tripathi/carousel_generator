<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Arial;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image {
            width: 100%;
            height: 70%;
            background-size: cover;
            background-position: center;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            width: 100%;
            height: 30%;
            background: #0a716d;
            position: relative;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .logo {
            position: absolute;
            bottom: 20px;
            left: 20px;
            height: 90px;
            width: 90px;
            padding: 5px; 
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .arrow {
            position: absolute;
            bottom: 20px;
            right: 20px;
            font-size: 24px;
        }

        .title-text {
            font-size: 3em;
            font-weight: bold;
            color: #fcfbfb;
            background: #9d1818;
            margin-bottom: 10px;
            text-align: center;
            padding: 10px;
            border-radius: 5px; 
        }

        .body-text {
            font-size: 20px;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 20px;
            color: #c16e15;
            text-align: center;
            position: absolute;
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            width: auto;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
<div class="image">
<img alt="Image" src="images\placeholder.jpg"/>
</div>
<div class="content">
<div class="title-text">A LONGER HISTORY UNFOLDS</div>
<div class="body-text">Globalisation has deep roots in human history, beyond recent decades.</div>
<div class="logo">
<img alt="logo" src="C:\Users\shash\OneDrive\Documents\Carousel_generator\logos\87689099-2d66-4250-9313-33aff26c7d2e1737449137020logo_.svg"/>
</div>
<div class="arrow">➜</div>
<div class="brand-name">TechCorp</div>
</div>
</div>
</body>
</html>
