<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Times New Roman;
            position: relative;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .image {
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            position: absolute;
            top: 0;
            left: 0;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            width: 90%;
            height: auto;
            background: #fbfafb;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            border-radius: 15px;
            
        }

        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            height: 90px;
            width: 90px;
            padding: 5px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .logo img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .arrow {
            position: absolute;
            top: 50%;
            right: -30px;
            font-size: 24px;
            background: #1a2942;
            color: white;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .title-text {
            font-size: 2.8em;
            font-weight: bold;
            color: #ffffff;
            background: #97123c;
            margin-bottom: 20px;
            text-align: left;
            padding: 15px 25px;
            border-radius: 10px;
            transform: translateY(-50px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .body-text {
            font-size: 22px;
            color: #000000;
            line-height: 1.6;
            margin-bottom: 40px;
            padding: 0 10px;
        }

        .brand-name {
            font-size: 20px;
            color: #c16e15;
            font-weight: bold;
            text-align: right;
            position: absolute;
            bottom: 20px;
            right: 30px;
            width: auto;
            padding: 10px 20px;
            border-radius: 5px;
            background: rgba(255,255,255,0.8);
        }
    </style>
</head>
<body>
<div class="container">
<div class="image">
<img alt="Image" src="images\placeholder.jpg"/>
</div>
<div class="logo">
<img alt="logo" src="C:\Users\shash\OneDrive\Documents\Carousel_generator\logos\c8c7c803-7e9a-41eb-8f28-a1b2694425b3logo_.svg"/>
</div>
<div class="content">
<div class="title-text">PROCRASTINATION AND DISTRACTION SYMPTOMS</div>
<div class="body-text">Procrastination hinders accomplishment. It leads to distractions, preventing relaxation and genuine connection with loved ones.</div>
<div class="arrow">➜</div>
<div class="brand-name">TechCorp</div>
</div>
</div>
</body>
</html>
