<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Verdana;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .image {
            flex: 1;
            display: flex;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales properly */
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #ececec;
            position: relative; /* To position the brand name at the bottom */
        }

        .logo {
            height: 90px;
            width: 90px;
            margin-bottom: 20px;
        }

        .logo img {
            height: 90px;
            width: 90px;
        }

        .arrow {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: #ffffff;
            background: #9d1d20;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 5px; 
        }

        .body-text {
            font-size: 2em;
            color: #000000;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 1.5em;
            color: #940b52;
            text-align: center;
            padding: 10px;
            border-radius: 5px;
            position: absolute;
            bottom: 20px; /* Fixes the brand name at the bottom */
            width: 100%; /* Makes the brand name span across the content area */
        }
    </style>
</head>
<body>
<div class="container">
<div class="content">
<div class="logo">
<img alt="Logo" src="C:\Users\shash\OneDrive\Documents\Carousel_generator\logos\Nonelogo_.svg"/>
</div>
<div class="arrow">➜</div>
<div class="title-text">A BATTLE WITH OCD</div>
<div class="body-text">As I shared my story, I felt distracted, akin to conversing in a noisy club. My thoughts were overtaken by the relentless song. I tried to suppress it, but my compulsive blinking caught the attention of the department head. I was caught off guard.</div>
<div class="brand-name">@legalwires</div>
</div>
<div class="image">
<img alt="Image" src="images\placeholder.jpg"/>
</div>
</div>
</body>
</html>
