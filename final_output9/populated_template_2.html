<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            background: #f5f5f5;
            font-family: "Times New Roman", sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .image {
            flex: 1;
            display: flex;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales properly */
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #cab29f;
        }

        .arrow {
            font-size: 24px;
            margin-bottom: 20px;
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            color: #2f4a60;
            background: #b0d2da;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .body-text {
            font-size: 2em;
            color: #2f4a60;
            line-height: 1.5;
        }

    </style>
</head>
<body>
<div class="container">
<div class="content">
<div class="arrow">➜</div>
<div class="title-text">SC HIGHLIGHTS ISSUES IN DELAYS</div>
<div class="body-text">The Court underlined that delays in verification disrupt the regularization process and violate principles of natural justice.</div>
</div>

</div>
</div>
</body>
</html>
