<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Verdana;
            min-height: 100vh;
        }

        .container {
            width: 1080px;
            height: 1080px;
            position: relative;
            overflow: hidden;
        }

        .image {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1080px;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.1) 0%,
                rgba(0,0,0,0.5) 70%,
                rgba(0,0,0,1.0) 100%
            );
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title-text {
            position: absolute;
            bottom: 150px; /* Adjusted to make space for body-text */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: white;
            font-size: 3em;
            font-weight: bold;
            line-height: 1.2;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .body-text {
            position: absolute;
            bottom: 90px; /* Positioned below title-text */
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            color: #ffffff;
            font-size: 1.5em;
            line-height: 1.4;
            opacity: 0.9;
        }

        .logo {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo img {
            height: 50px;
            object-fit: contain;
        }

        .brand-name {
            position: absolute;
            bottom: 20px; /* Adjusted to be below the body text */
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.3em;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
<div class="container">
<div class="image">
<img alt="Flight attendant demonstrating safety instructions" src="images\placeholder.jpg"/>
</div>
<div class="title-text">INTRODUCTION TO MEMGPT: UNLOCKING AI MEMORY</div>
<div class="body-text">Generative AI evolves but struggles with long-term memory.</div>
<div class="logo">
<img alt="The Tatva Logo" src="C:\Users\shash\OneDrive\Documents\Carousel_generator\logos\Nonelogo_.svg"/>
</div>
<div class="brand-name">@legalwires</div>
</div>
</body>
</html>
