<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 1080px;
        height: 1080px;
        background: #f5f5f5; /*Preserve Original Color */
        font-family: 'Times New Roman', serif; /* Modified Font-family */
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        display: flex;
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
    }

    .image {
        flex: 1;
        display: flex;
    }

    .image img {
        width: 100%;
        height: 100%;
        object-fit: cover; /* Ensures the image scales properly */
    }

    .content {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: #002147; /* New Background color */
    }

    .logo {
        height: 90px;
        width: 90px;
        margin-bottom: 20px;
    }

    .logo img {
        height: 90px;
        width: 90px;
    }

    .arrow {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .title-text {
        font-size: 4em;
        font-weight: bold;
        color: #B0E0E6; /* New color */
        background: #002147; /* New Background color */
        padding: 10px;
        text-align: center;
        margin-bottom: 20px;
    }

    .body-text {
        font-size: 2em;
        color: white; /* New color */
        line-height: 1.5;
    }

    .watermark {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        color: white; /*Preserve Original Color */
        font-size: 14px;
    }
</style>
</head>
