<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>News Post</title>
<style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: "Times New Roman", serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #cab29f;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .image {
            flex: 1;
            display: flex;
        }

        .image img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Ensures the image scales properly */
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            background: #cab29f; /* Modified Existing Background */
        }

        .arrow {
            font-size: 24px;
            margin-bottom: 20px;
            color: #2f4a60; /* Modify Color */
        }

        .title-text {
            font-size: 4em;
            font-weight: bold;
            padding: 10px;
            text-align: center;
            margin-bottom: 20px;
            color: #2f4a60; /* Modify Color */
            background: #b0d2da; /* Modify Existing Background */
        }

        .body-text {
            font-size: 2em;
            line-height: 1.5;
            color: #2f4a60; /* Modify Color */
        }

        .watermark {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #2f4a60; /* Modify Color */
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="container">
<div class="content">
<div class="arrow">➜</div>
<div class="title-text">INDIAN JUDICIARY CRITIQUES LAPSES</div>
<div class="body-text">The enforced termination was deemed illegal and arbitrary, citing a violation of principles of natural justice.</div>
</div>
<div class="image">
<img alt="News Image" src="images\placeholder.jpg"/>
</div>
</div>
</body>
</html>
