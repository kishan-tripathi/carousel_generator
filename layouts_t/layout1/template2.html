<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Growth Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            height: 100%;
            position: relative;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #B8C4D2;
        }

        .title-text {
            font-size: 5em;
            font-weight: bold;
            color: #1A1A1A;
            line-height: 1.1;
            margin-bottom: 40px;
            max-width: 800px;
        }

        .body-text {
            font-size: 2.5em;
            color: #1A1A1A;
            max-width: 600px;
        }

        .arrow {
            font-size: 30px;
            margin-top: 200px;
            margin-left: 900px;
            position: relative;
            z-index: 1;
        }


    </style>
</head>
<body>
    <div class="container">
        <div class="title-text">There's exponential growth happening exponential growth happening</div>
        <div class="body-text">Carousel posts are seeing great reach and results.Carousel posts are seeing great reach and results</div>
        <div class="arrow">➜</div>
    </div>
</body>
</html>
