<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Business Plan Post</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1080px;
            height: 1080px;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            
        }

        .content {
            width: 100%;
            height: 100%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            background: #1A1A1A;
            
        }


        .number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 80px;
            margin-top: 40px;
            color: #FF9EE5;
        }

        .title-text {
            font-size: 5em;
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 40px;
            max-width: 800px;
            color: #FF9EE5;
        }

        .body-text {
            font-size: 1.8em;
            line-height: 1.5;
            max-width: 700px;
            margin-bottom: 60px;
            color: #FF9EE5;
        }

        .instagram {
            position: absolute;
            bottom: 60px;
            font-size: 1.2em;
            letter-spacing: 2px;
            color: #FF9EE5;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="number">04</div>
        <div class="title-text">START WITH A SOLID BUSINESS PLAN</div>
        <div class="body-text">
            A well-crafted business plan is essential for success. Outline your goals, target market, products/services, marketing strategies, and financial projections. It sets the foundation for your business.
        </div>
        <div class="instagram">swipe for more</div>
    </div>
</body>
</html>
