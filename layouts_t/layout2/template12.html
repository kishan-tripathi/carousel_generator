<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Business Plan Post</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        width: 100%;
        height: 100%;
        font-family: Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        
    }

    .container {
        width: 1080px;
        height: 1080px;
        padding: 60px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        position: relative;
        background: #1A1A1A;
    }

    .number {
        font-size: 2.5em;
        font-weight: bold;
        margin-bottom: 40px; 
        margin-top: 40px;
        color: #FF9EE5;
    }

    .title-text {
        font-size: 4.5em;
        font-weight: bold;
        line-height: 1.2; 
        margin-bottom: 50px; 
        max-width: 800px;
        color: #FF9EE5;
    }

    .body-text {
        font-size: 2.5em;
        line-height: 1.6;
        max-width: 800px;
        margin-bottom: 50px;
        color: #FF9EE5;
    }

    .brand-name {
        position: absolute;
        bottom: 60px;
        font-size: 1.2em;
        letter-spacing: 2px;
        color: #FF9EE5;
    }
</style>
</head>
<body>
<div class="container">
    <div class="number">06</div>
    <div class="title-text">24 SEVEN RETAIL FILE LAWSUIT SEVEN RETAIL FILE LAWSUIT</div>
    <div class="body-text">
        Twenty Four Seven Retail Store Private Limited brings a lawsuit to Delhi High Court, charging Godfrey Phillips India Ltd. with unauthorized use of their trademark, '24Seven'.
    </div>
    <div class="brand-name">BRAND NAME</div>
</div>
</body>
</html>
